name: Test and deploy

# Pull requests run everything: the unit tests and the browser tests.
# A push to main (a merged pull request) re-runs only the fast unit
# tests and then deploys — the browser tests already passed on the
# pull request against that same merge, and repeating them on main
# mostly gave a flaky browser test a second chance to block a good
# deploy. Only a commit that came through a MERGED pull request is
# deployed: a direct push to main is tested but not shipped (a warning
# says why). "Run workflow" (workflow_dispatch) deploys main on demand.
#
# The deploy job ships to the repository owner's Cloudflare Pages project,
# set by three repository variables (Settings → Secrets and variables →
# Actions → Variables): CLOUDFLARE_ACCOUNT_ID, D1_DATABASE_ID and
# PAGES_PROJECT, plus the CLOUDFLARE_API_TOKEN secret. A fork without
# them skips the deploy; copies made with the "Deploy to Cloudflare"
# button are deployed by Cloudflare itself (Workers Builds), not here.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

# One run per pull request: a new push cancels the run it replaces
# instead of queuing behind it. Runs on main are never cancelled (each
# may deploy). Text-only changes (Markdown, docs/) don't run at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: tailwind.css matches index.html and js/
        run: |
          npx -y tailwindcss@3.4.17 -c tailwind.config.js -o tailwind.css --minify
          git diff --exit-code tailwind.css || { echo "::error::tailwind.css is stale: run the command in tailwind.config.js and commit it."; exit 1; }
      - name: Run test suites
        run: |
          for f in tests/*.test.mjs; do
            echo "== $f"
            node --test "$f"
          done

  # The two browsers run side by side, each on its own runner with its own
  # throwaway database. They run inside Playwright's official image, which
  # already has both browsers and every system package they need, so there
  # is no per-run browser download or apt install (that step took 38 s to
  # 5 min and once hung). The image tag must match @playwright/test in
  # e2e/package.json exactly.
  browser:
    # Pull requests only. On main the deploy job accepts this job
    # being skipped (see its condition) — the PR run is the test.
    if: github.event_name == 'pull_request'
    name: browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [iphone-safari, desktop-chrome]
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --user 1001
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Browser tests (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }}
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.project }}
          path: /tmp/arthatula-e2e-results
          retention-days: 7

  deploy:
    needs: [unit, browser]
    # always() + explicit results: on main the browser job is skipped
    # by design and that must not skip the deploy; a FAILED unit (or,
    # on a pull request, browser) job still blocks it.
    if: ${{ always() && vars.PAGES_PROJECT != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.unit.result == 'success' && (needs.browser.result == 'success' || needs.browser.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Only ship changes merged through a pull request
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          merged=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null)] | length')
          if [ "$merged" -gt 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Not deployed::This commit was pushed straight to main. Open a pull request and merge it to deploy."
          fi
      - name: Create the Pages project on the first deploy
        if: steps.gate.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
        run: |
          if npx -y wrangler@3.114.17 pages project list | grep -qw "$PAGES_PROJECT"; then
            echo "Pages project $PAGES_PROJECT already exists."
          else
            npx -y wrangler@3.114.17 pages project create "$PAGES_PROJECT" --production-branch main
          fi
      # wrangler.toml in the repo is the Worker config (the Deploy to
      # Cloudflare button). Pages needs its own: write it for this deploy.
      - name: Write the Pages config
        if: steps.gate.outputs.ok == 'true'
        env:
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          cat > wrangler.toml <<EOF
          name = "$PAGES_PROJECT"
          compatibility_date = "2024-11-01"
          pages_build_output_dir = "."

          [[d1_databases]]
          binding = "DB"
          database_name = "arthatula"
          database_id = "$D1_DATABASE_ID"
          EOF
      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name ${{ vars.PAGES_PROJECT }} --branch main
