name: Test and deploy

# Every pull request and every push to main runs the unit tests and the
# browser tests. Only a commit that came through a MERGED pull request is
# deployed: a direct push to main is tested but not shipped (a warning
# says why). "Run workflow" (workflow_dispatch) deploys main on demand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run test suites
        run: |
          for f in tests/*.test.mjs; do
            echo "== $f"
            node --test "$f"
          done

  # The two browsers run side by side, each on its own runner with its own
  # throwaway database. They run inside Playwright's official image, which
  # already has both browsers and every system package they need, so there
  # is no per-run browser download or apt install (that step took 38 s to
  # 5 min and once hung). The image tag must match @playwright/test in
  # e2e/package.json exactly.
  browser:
    name: browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [iphone-safari, desktop-chrome]
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --user 1001
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Browser tests (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }}
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.project }}
          path: e2e/test-results
          retention-days: 7

  deploy:
    needs: [unit, browser]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Only ship changes merged through a pull request
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          merged=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null)] | length')
          if [ "$merged" -gt 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Not deployed::This commit was pushed straight to main. Open a pull request and merge it to deploy."
          fi
      - name: Create the Pages project on the first deploy
        if: steps.gate.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6dc5b43c380d094e9d5bd6c1413e35d3
        run: |
          if npx -y wrangler@3.114.17 pages project list | grep -qw arthatula; then
            echo "Pages project arthatula already exists."
          else
            npx -y wrangler@3.114.17 pages project create arthatula --production-branch main
          fi
      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6dc5b43c380d094e9d5bd6c1413e35d3
          command: pages deploy . --project-name arthatula --branch main
